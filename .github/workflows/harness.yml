name: Harness

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".agents/**"
      - ".codex/**"
      - ".github/workflows/harness.yml"
      - "docs/**"
      - "eng/**"
      - "evals/**"
      - "openspec/**"
      - "Orchestration/.agents/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [master]
    paths:
      - "AGENTS.md"
      - ".agents/**"
      - ".codex/**"
      - ".github/workflows/harness.yml"
      - "docs/**"
      - "eng/**"
      - "evals/**"
      - "openspec/**"
      - "Orchestration/.agents/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.10.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate root-owned harness
        shell: pwsh
        run: ./eng/check-harness.ps1 -Mode Repository
