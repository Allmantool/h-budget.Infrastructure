services:
  homebudget-accounting-api:
    container_name: homebudget-observability-test-accounting-api
    ports: !override
      - "15307:80"
    environment: &accounting-environment
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:80
      DatabaseConnectionOptions__ConnectionString: Server=homebudget-sql-server,1433;Database=HomeBudget.Accounting;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      DatabaseConnectionOptions__RedisConnectionString: redis_server:6379
      KafkaOptions__ProducerSettings__BootstrapServers: kafka:29092
      KafkaOptions__ConsumerSettings__BootstrapServers: kafka:29092
      KafkaOptions__AdminSettings__BootstrapServers: kafka:29092
      MongoDbOptions__ConnectionString: mongodb://mongoadmin:${MONGO_DB_PASSWORD}@shared-mongo-db:27017/admin?authSource=admin
      EventStoreDb__Url: esdb://event-store-db:2113?tls=false
      ObservabilityOptions__TelemetryEndpoint: ${OBSERVABILITY_OTLP_ENDPOINT:-http://jaeger:4317}
      ObservabilityOptions__LogsEndpoint: ""
      SeqOptions__IsEnabled: "true"
      SeqOptions__Uri: http://logging-seq:5341
      ElasticSearchOptions__IsEnabled: "false"

  homebudget-accounting-payments-consumer-worker:
    container_name: homebudget-observability-test-payments-worker
    environment:
      <<: *accounting-environment
      OTEL_SERVICE_NAME: homebudget-accounting-payments-consumer-worker
    depends_on:
      homebudget-sql-server:
        condition: service_healthy
      redis_server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      event-store-db:
        condition: service_healthy
      shared-mongo-db:
        condition: service_healthy

  prometheus:
    container_name: homebudget-observability-test-prometheus
    ports: !override
      - "19190:9090"
    depends_on: !reset []

  grafana:
    container_name: homebudget-observability-test-grafana
    ports: !override
      - "13500:3000"

  jaeger:
    container_name: homebudget-observability-test-jaeger
    ports: !override
      - "11686:16686"

  seq:
    container_name: homebudget-observability-test-seq
    environment: !override
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports: !override
      - "15341:80"
      - "15342:5341"

  flyway:
    container_name: homebudget-observability-test-flyway

  homebudget-sql-server:
    container_name: homebudget-observability-test-sql
    ports: !override
      - "11433:1433"

  redis_server:
    container_name: homebudget-observability-test-redis
    ports: !override
      - "16579:6379"

  kafka:
    container_name: homebudget-observability-test-kafka
    ports: !override
      - "19092:9092"

  kafka-init:
    container_name: homebudget-observability-test-kafka-init

  event-store-db:
    container_name: homebudget-observability-test-eventstore
    ports: !override
      - "12113:2113"

  shared-mongo-db:
    container_name: homebudget-observability-test-mongo
    ports: !override
      - "17027:27017"
